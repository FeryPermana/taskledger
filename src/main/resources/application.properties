spring.application.name=taskledger

spring.datasource.url=jdbc:mysql://localhost:3306/taskledger
spring.datasource.username=root
spring.datasource.password=

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
app.file.allowed-types=image/jpeg,image/png,application/pdf,text/plain,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=TaskLedgerSecretKeyForDevelopmentOnly12345678901234567890
jwt.expiration=86400000